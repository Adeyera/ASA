name: african_art_marketplace
description: AR-Enhanced African Cultural Art Marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1

  # AR — ARCore (Android) + ARKit (iOS)
  ar_flutter_plugin: ^0.7.3
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
